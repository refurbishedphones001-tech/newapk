name: Build OnionQualityAI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu-latest runner already ships with an Android SDK at
      # $ANDROID_HOME (a separate "install the SDK" action is what was
      # breaking the build earlier — those actions frequently fall over on
      # the current runner image). We just need to make sure the exact
      # platform and build-tools this project targets are present, then
      # point Gradle at that same SDK explicitly via local.properties.
      - name: Install required Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find -L "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No sdkmanager binary found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 2
            exit 1
          fi
          echo "Using sdkmanager at: $SDKMANAGER"

          # Accept licenses, then install into $ANDROID_HOME explicitly (sdk_root)
          # so there's no ambiguity about where the packages end up.
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "Installed platforms:"
          ls "$ANDROID_HOME/platforms" || true
          echo "Installed build-tools:"
          ls "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OnionQualityAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
